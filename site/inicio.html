  <p>A Elolog é uma plataforma de intermediação logística. Simule o envio da sua carga, compare os preços de transitários e transportadoras verificados e acompanhe a encomenda até ao destino, incluindo envios entre Portugal, São Tomé e Príncipe, Angola, Cabo Verde e outros países.</p>
