<script>
/* Ao recarregar com uma sessão de administrador ou prestador, esconde o menu e o rodapé do site desde o 1.º desenho
   (evita o "piscar"). Termina quando a sessão é validada (js/autenticacao/login.js e 15-profile-registration.js);
   o limite de 4 s é só uma salvaguarda. */
try{var u=JSON.parse(sessionStorage.getItem('th_user')||localStorage.getItem('th_user')||'null');
if(u&&(u.role==='admin'||u.role==='prestador'||u.role==='cliente')){document.documentElement.classList.add('app-focus-pending');
setTimeout(function(){document.documentElement.classList.remove('app-focus-pending')},4000)}}catch(e){}
</script>
